
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101010">
  <title>Digital Business Card</title>
  <meta name="description" content="Digital business card and contact information">
  <style>
    :root {
      --bg: #f4f4f2;
      --card: #ffffff;
      --text: #171717;
      --muted: #6d6d6d;
      --line: #e8e8e8;
      --accent: #f28c28;
      --dark: #111111;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 26px 14px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrap {
      width: 100%;
      max-width: 480px;
      margin: auto;
    }

    .card {
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 14px 40px rgba(0,0,0,.07);
    }

    .top {
      padding: 28px 24px 24px;
      text-align: center;
      background: var(--dark);
      color: white;
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 15px;
      border-radius: 20px;
      border: 1px solid #454545;
      background: white;
      object-fit: contain;
      padding: 5px;
    }

    .initials {
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      margin: 0 auto 15px;
      border: 1px solid #454545;
      border-radius: 20px;
      background: #252525;
      color: white;
      font-size: 25px;
      font-weight: bold;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .role {
      margin: 9px 0 0;
      color: #e6e6e6;
      font-size: 14px;
      line-height: 1.5;
    }

    .company {
      margin: 7px 0 0;
      color: #ffb15e;
      font-size: 15px;
      font-weight: bold;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 22px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 12px 10px;
      border: 1px solid #555;
      border-radius: 12px;
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn.primary {
      color: #171717;
      background: var(--accent);
      border-color: var(--accent);
    }

    .content { padding: 24px; }

    .section-title {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 700;
    }

    .about {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .detail {
      display: flex;
      align-items: flex-start;
      gap: 13px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }

    .detail:last-child { border-bottom: 0; }

    .ico {
      display: grid;
      place-items: center;
      flex: 0 0 40px;
      height: 40px;
      border-radius: 12px;
      background: #f2f2f2;
      font-size: 18px;
    }

    .detail-label {
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .detail-value {
      color: var(--text);
      font-size: 14px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .detail-value a {
      color: var(--text);
      text-decoration: none;
    }

    .detail-value a:hover { text-decoration: underline; }

    .links {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .link-btn {
      padding: 13px 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      text-align: center;
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .link-btn:hover { border-color: var(--accent); }

    .footer {
      padding: 17px;
      background: #fafafa;
      border-top: 1px solid var(--line);
      color: #777;
      text-align: center;
      font-size: 11px;
    }

    @media (max-width: 360px) {
      h1 { font-size: 23px; }
      .content { padding: 19px; }
      .top { padding: 25px 18px; }
      .btn { font-size: 12px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <article class="card">
      <header class="top">
        <div id="brandMark" class="initials">TB</div>
        <h1 id="name">Client Name</h1>
        <p class="role" id="role">Designation</p>
        <p class="company" id="company">Company Name</p>

        <div class="actions">
          <a class="btn primary" id="callBtn" href="tel:+919876543210">☎ Call Now</a>
          <a class="btn" id="waBtn" href="https://wa.me/919876543210" target="_blank" rel="noopener">WhatsApp</a>
          <button class="btn" id="saveBtn" type="button">＋ Save Contact</button>
          <a class="btn" id="emailBtn" href="mailto:hello@example.com">✉ Email</a>
        </div>
      </header>

      <div class="content">
        <section>
          <h2 class="section-title">About</h2>
          <p class="about" id="about">
            Add a short introduction about the person, their work and company.
          </p>
        </section>

        <section>
          <h2 class="section-title">Contact Information</h2>
          <div id="details"></div>
        </section>

        <section>
          <h2 class="section-title" style="margin-top:24px">Connect Online</h2>
          <div class="links" id="links"></div>
        </section>
      </div>

      <footer class="footer">
        Digital Business Card · Powered by TapNxt
      </footer>
    </article>
  </main>

  <script>
    // ========== CLIENT DETAILS: EDIT THIS SECTION ==========

    const client = {
      name: "SHUBHAM KAUSHIK",
      designation: "FOUNDER AT TapNxt",
      company: "TapNxt Pvt.Ltd",
      about: "TapNxt products help professionals share information, collect reviews and create stronger connections.",
      phone: "+91 9111299064",
      whatsapp: "+91 9111299064",
      email: "Kaushikshubham2909@gmail.com",

      address: "Kolkata India",
      location: "Kolkata, West Bengal, India",

      website: "https://TapNxt.in",
      linkedin: "https://www.linkedin.com/in/shubham-kaushik-13392a263",

      // Optional: paste a PUBLIC image URL, or leave blank.
      companyLogo: "https://kommodo.ai/i/q1LsM7n7AzvYoCr9ppwy",
      profilePhoto: "https://kommodo.ai/i/q1LsM7n7AzvYoCr9ppwy"
    };

    // ========== PAGE SETUP: NO NEED TO EDIT BELOW ==========

    const $ = id => document.getElementById(id);

    function cleanPhone(value) {
      return value.replace(/[^\d+]/g, "");
    }

    function safeURL(value) {
      try {
        const url = new URL(value);
        return ["http:", "https:"].includes(url.protocol) ? url.href : "";
      } catch {
        return "";
      }
    }

    function addDetail(icon, label, value, href) {
      if (!value || value.startsWith("Enter ")) return "";

      const content = href
        ? `<a href="${href}" target="_blank" rel="noopener">${escapeHTML(value)}</a>`
        : escapeHTML(value);

      return `
        <div class="detail">
          <div class="ico">${icon}</div>
          <div>
            <div class="detail-label">${label}</div>
            <div class="detail-value">${content}</div>
          </div>
        </div>`;
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        '"': "&quot;", "'": "&#39;"
      }[char]));
    }

    $("name").textContent = client.name;
    $("role").textContent = client.designation;
    $("company").textContent = client.company;
    $("about").textContent = client.about;
    document.title = `${client.name} | Digital Business Card`;

    const logo = safeURL(client.companyLogo);
    const photo = safeURL(client.profilePhoto);
    const mark = $("brandMark");

    if (logo || photo) {
      const img = document.createElement("img");
      img.className = "logo";
      img.alt = logo ? `${client.company} logo` : `${client.name} photo`;
      img.src = logo || photo;
      img.onerror = () => {
        img.remove();
        mark.hidden = false;
      };
      mark.hidden = true;
      mark.replaceWith(img);
    } else {
      mark.textContent = client.name
        .split(/\s+/).filter(Boolean).slice(0, 2)
        .map(part => part[0].toUpperCase()).join("");
    }

    const phone = cleanPhone(client.phone);
    const wa = cleanPhone(client.whatsapp || client.phone).replace("+", "");
    $("callBtn").href = `tel:${phone}`;
    $("waBtn").href = `https://wa.me/${wa}`;
    $("emailBtn").href = `mailto:${client.email}`;

    $("details").innerHTML =
      addDetail("☎", "Phone", client.phone, `tel:${phone}`) +
      addDetail("✉", "Email", client.email, `mailto:${client.email}`) +
      addDetail("⌂", "Office Address", client.address,
        `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(client.address)}`) +
      addDetail("⌖", "Location", client.location,
        `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(client.location)}`) +
      addDetail("◎", "Company Website", client.website, safeURL(client.website));

    const socialLinks = [
      { label: "LinkedIn ↗", url: safeURL(client.linkedin) },
      { label: "Company Website ↗", url: safeURL(client.website) }
    ].filter(item => item.url);

    $("links").innerHTML = socialLinks.map(item =>
      `<a class="link-btn" href="${item.url}" target="_blank" rel="noopener">${item.label}</a>`
    ).join("");

    $("saveBtn").addEventListener("click", () => {
      const vcard = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        `FN:${client.name}`,
        `ORG:${client.company}`,
        `TITLE:${client.designation}`,
        `TEL;TYPE=CELL:${client.phone}`,
        `EMAIL:${client.email}`,
        `ADR;TYPE=WORK:;;${client.address};;;;`,
        `URL:${safeURL(client.website)}`,
        `NOTE:${client.about}`,
        "END:VCARD"
      ].join("\r\n");

      const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${client.name.replace(/[^a-z0-9]/gi, "-")}.vcf`;
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
